# ---- Project Info and Dependencies ----

[project.urls]
Repository = "https://github.com/changeme/changeme"
# Homepage = "https://..."
# Documentation = "https://..."

[project]
name = "changeme"
description = "changeme"
authors = [
    { name="changeme", email="changeme@example.com" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4.0"
dynamic = ["version"]

# https://pypi.org/classifiers/
# Adjust as needed:
classifiers = [
    # Adjust as needed:
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    # Include this to avoid accidentally publishing to PyPI:
    # "Private :: Do Not Upload",
]


# ---- Main dependencies ----

dependencies = [
    "python-dotenv>=1.0.1",
    "typer>=0.23.1",
]


# ---- Dev dependencies ----

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "ruff>=0.11.0",
    "codespell>=2.4.1",
    "ty>=0.0.76",
    "yamllint>=1.36.2",
    "pre-commit>=3.7.1",
]

[project.scripts]
# Add script entry points here.
changeme = "changeme:cli"


# ---- Build system ----

# Dynamic versioning from:
# https://github.com/ninoseki/uv-dynamic-versioning/

[build-system]
requires = ["hatchling==1.30.1", "uv-dynamic-versioning==0.14.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"
# Note JSON schemas don't seem to be right for tool.hatch.version.source so
# this may cause false warnings in IDEs.
# https://github.com/ninoseki/uv-dynamic-versioning/issues/21

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true

[tool.uv]
# Keep local development aligned with the CI version and its security checks.
required-version = ">=0.12.3"

[tool.hatch.build.targets.wheel]
# The source location for the package.
packages = ["src/changeme"]

[tool.hatch.build.targets.sdist]
# Keep machine-local settings and project tooling out of published archives.
# Hatch always includes pyproject.toml, README.md, the license, and .gitignore.
only-include = ["src"]


# ---- Settings ----

[tool.ruff]
# Set as desired, typically 88 (black standard) or 100 (wide).
line-length = 120
indent-width = 4

[tool.ruff.lint]
# See: https://docs.astral.sh/ruff/rules/
select = [
    # Basic list from: https://docs.astral.sh/ruff/linter/#rule-selection
    "E", # https://docs.astral.sh/ruff/rules/#error-e
    "F", # https://docs.astral.sh/ruff/rules/#pyflakes-f
    "UP", # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "B", # https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "I", # https://docs.astral.sh/ruff/rules/#isort-i
]
ignore = [
    "E501", # https://docs.astral.sh/ruff/rules/line-too-long/
]

# ty is Astral's fast type checker and language server.
# https://docs.astral.sh/ty/
[tool.ty.rules]
# This is part of ty's recommended stricter configuration.
missing-type-argument = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=changeme --cov-branch --cov-report=term-missing --cov-fail-under=100"
